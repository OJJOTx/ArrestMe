name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Assemble Debug APK (Arrest Engine V0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & Build Dependencies
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Assemble Debug APK with Gradle Wrapper
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-logs/gradle-assembleDebug.log

      - name: Verify Generated Debug APK Exists
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrest-me-v0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            build-logs/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
