name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Assemble APK (ArrestMe V0.6)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & Build Dependencies
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets
          echo "$KEYSTORE_BASE64" | base64 --decode > secrets/release.keystore
          echo "KEYSTORE_FILE=$(pwd)/secrets/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Run Unit Tests
        env:
          ORG_GRADLE_PROJECT_ARRESTME_API_BASE_URL: ${{ vars.ARRESTME_API_BASE_URL }}
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build-logs/gradle-testDebugUnitTest.log

      - name: Assemble APK with Gradle Wrapper
        env:
          ORG_GRADLE_PROJECT_ARRESTME_API_BASE_URL: ${{ vars.ARRESTME_API_BASE_URL }}
        run: |
          set -o pipefail
          mkdir -p build-logs
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            echo "Signing with persistent release keystore..."
            ./gradlew assembleRelease --stacktrace 2>&1 | tee build-logs/gradle-assemble.log
            cp app/build/outputs/apk/release/app-release.apk ArrestMe-v0.6.0.apk
            cp ArrestMe-v0.6.0.apk ArrestMe-v0.6.0-debug.apk
          else
            echo "Release keystore secrets not detected; building assembleDebug..."
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build-logs/gradle-assemble.log
            cp app/build/outputs/apk/debug/app-debug.apk ArrestMe-v0.6.0-debug.apk
            cp ArrestMe-v0.6.0-debug.apk ArrestMe-v0.6.0.apk
          fi

      - name: Verify Generated APK Exists
        run: |
          ls -lh ArrestMe-v0.6.0.apk
          ls -lh ArrestMe-v0.6.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrest-me-v0.6-apk
          path: |
            ArrestMe-v0.6.0.apk
            ArrestMe-v0.6.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release to GitHub Releases Tab
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0-build-${{ github.run_number }}
          name: "Arrest Me v0.6.0 - Build #${{ github.run_number }}"
          body: |
            ## Arrest Me v0.6.0 Release Build (#${{ github.run_number }})
            Automated APK build from commit `${{ github.sha }}`.

            ### Features in this release (V0.4, V0.5 & V0.6 Partner System):
            1. **V0.4 Advanced Partners & Negotiations**: Exact username search, invitation codes, directional approval policies (`requireApprovalBeforeArrest`), versioned proposals, counteroffers, conflict 409 protection, and scheduled arrests.
            2. **V0.5 Remote Arrest Execution & Selectable App Catalog**: Controlled package-level app catalog, decoupled CloudCommandCoordinator, offline schedule materialization, live session dashboard, and automatic restoration of original self-arrest rules.
            3. **V0.6 Full In-App Chat + Structured Requests**: Dedicated partner conversations, inline interactive structured request cards (early release, temporary app access, mode changes, extensions), scoped temporary app overrides, and active arrest communication panel without breaching lockdown.
            4. **Core Local Engine Integrity**: Local Self Arrest engine, overlay manager, and accessibility service remain 100% functional and offline-independent.

            ### Download:
            Download **`ArrestMe-v0.6.0.apk`** below to install directly on your Android device.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ArrestMe-v0.6.0.apk
            ArrestMe-v0.6.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            build-logs/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
